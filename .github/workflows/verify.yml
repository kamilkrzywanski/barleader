name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The bytecode is Java 17. The newest LTS and the latest release run the same tests.
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: mvn -B verify
      - name: Release artifacts build without signing
        if: matrix.java == '21'
        run: mvn -B -P release -Dgpg.skip -DskipTests package
